name: Build NRO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          dkp-pacman --noconfirm -U \
            https://pkg.devkitpro.org/packages/switch/aarch64/switch-curl-8.10.1-1-aarch64.pkg.tar.xz \
            https://pkg.devkitpro.org/packages/switch/aarch64/switch-mbedtls-3.6.2-1-aarch64.pkg.tar.xz \
            https://pkg.devkitpro.org/packages/switch/aarch64/switch-zlib-1.3.1-1-aarch64.pkg.tar.xz \
            https://pkg.devkitpro.org/packages/switch/aarch64/switch-sdl2-2.30.9-2-aarch64.pkg.tar.xz \
            https://pkg.devkitpro.org/packages/switch/aarch64/switch-sdl2_image-2.8.2-1-aarch64.pkg.tar.xz \
            https://pkg.devkitpro.org/packages/switch/aarch64/switch-sdl2_ttf-2.22.0-1-aarch64.pkg.tar.xz \
            https://pkg.devkitpro.org/packages/switch/aarch64/switch-jansson-2.14-2-aarch64.pkg.tar.xz \
            https://pkg.devkitpro.org/packages/switch/aarch64/switch-zziplib-0.13.78-1-aarch64.pkg.tar.xz

      - name: Compilar
        run: |
          make clean
          make

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: switch-updater
          path: switch-updater.nro
