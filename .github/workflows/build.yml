name: Build NRO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          dkp-pacman --noconfirm -Sy --disable-download-timeout \
            switch-curl switch-mbedtls switch-zlib \
            switch-sdl2 switch-sdl2_image switch-sdl2_ttf \
            switch-jansson switch-bzip2 switch-libpng \
            switch-freetype switch-zziplib || true
          dkp-pacman --noconfirm -Sy --disable-download-timeout \
            switch-curl switch-mbedtls switch-zlib \
            switch-sdl2 switch-sdl2_image switch-sdl2_ttf \
            switch-jansson switch-bzip2 switch-libpng \
            switch-freetype switch-zziplib

      - name: Compilar
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITA64: /opt/devkitpro/devkitA64
        run: |
          make clean
          make

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: switch-updater
          path: switch-updater.nro
